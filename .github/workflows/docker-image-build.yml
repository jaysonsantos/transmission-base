name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/transmission-base
  # Keep these in sync with the Dockerfile ARG defaults.
  TRANSMISSION_VERSION: "4.1.4"
  TRANSMISSION_SHA256: "86e7aa020cdf64826447034bc85f4d3b7c848d8c0891d9dc9b9fddfb2c805d22"
  UBUNTU_VERSION: "26.04"

jobs:
  # Each platform builds on a native runner. A QEMU arm64 compile of
  # Transmission takes more than an hour and kills the hosted runner.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            TRANSMISSION_VERSION=${{ env.TRANSMISSION_VERSION }}
            TRANSMISSION_SHA256=${{ env.TRANSMISSION_SHA256 }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Floating version tag plus an immutable per-build tag. The dev branch
      # publishes a separate channel.
      - name: Create multi-arch tags
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BASE_TAG="${TRANSMISSION_VERSION}-ubuntu${UBUNTU_VERSION}"
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            TAGS=("dev" "${BASE_TAG}-dev" "${BASE_TAG}-dev-${SHORT_SHA}")
          else
            TAGS=("${BASE_TAG}" "${BASE_TAG}-${SHORT_SHA}")
          fi
          ARGS=()
          for t in "${TAGS[@]}"; do ARGS+=(-t "${IMAGE_NAME}:${t}"); done
          docker buildx imagetools create "${ARGS[@]}" \
            "${IMAGE_NAME}:build-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:build-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAGS[0]}"
