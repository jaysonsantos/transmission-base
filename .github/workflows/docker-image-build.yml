name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
  workflow_dispatch:

# The versions live only in the Dockerfile ARG defaults. Renovate updates
# them there (renovate.json), so the workflow passes no build arguments.
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/transmission-base

jobs:
  # Each platform builds on a native runner. A QEMU arm64 compile of
  # Transmission takes more than an hour and kills the hosted runner.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # A pull request only builds, so Renovate automerge waits for it.
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.arch }}

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Floating version tag plus an immutable per-build tag. The dev branch
      # publishes a separate channel.
      - name: Create multi-arch tags
        shell: bash
        run: |
          set -euo pipefail
          arg() { sed -n "s/^ARG $1=//p" Dockerfile; }
          TRANSMISSION_VERSION="$(arg TRANSMISSION_VERSION)"
          UBUNTU_VERSION="$(arg UBUNTU_VERSION)"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BASE_TAG="${TRANSMISSION_VERSION}-ubuntu${UBUNTU_VERSION}"
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            TAGS=("dev" "${BASE_TAG}-dev" "${BASE_TAG}-dev-${SHORT_SHA}")
          else
            TAGS=("${BASE_TAG}" "${BASE_TAG}-${SHORT_SHA}")
          fi
          ARGS=()
          for t in "${TAGS[@]}"; do ARGS+=(-t "${IMAGE_NAME}:${t}"); done
          docker buildx imagetools create "${ARGS[@]}" \
            "${IMAGE_NAME}:build-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:build-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAGS[0]}"
